<h1>Dashboard</h1>

<app-search-input (search)="onSearch($event)" />
@if (state$ | async; as state) {

  @if (state.loading) {
    <app-loading-spinner />
  } @else if (state.error) {
    <p>Something went wrong.</p>
    
  } @else {
    <div class="metrics">
      @for (metric of state.metrics; track metric.name) {
        <app-metric-card [metric]="metric"></app-metric-card>
      }
    </div>
  }

}
