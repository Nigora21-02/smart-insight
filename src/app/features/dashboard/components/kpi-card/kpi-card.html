<div class="kpi-card">
	<div class="kpi-header">
    <div class="kpi-title">{{ title }}</div>
    <img src="icons/{{ icon }}.svg" alt="icon" class="kpi-icon" />
  </div>
  <div class="kpi-context">
  <div class="kpi-value">{{ value }}</div>
  <div class="kpi-change" [ngClass]="{ positive: change > 0, negative: change < 0 }">
    <span *ngIf="change > 0">▲</span>
    <span *ngIf="change < 0">▼</span>
    {{ change }}%
  </div>
  </div>
</div>
