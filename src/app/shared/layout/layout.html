<div class="layout">
  <!-- Mobile header -->
  <div class="mobile-header">
    <button class="menu-btn" (click)="toggleSidebar()">☰</button>
    <h2>Smart Insight</h2>
  </div>

  <!-- Overlay -->
  <div class="overlay" *ngIf="isSidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <h2 class="desktop-title">Smart Insight</h2>

    <nav>
      <a routerLink="/" (click)="closeSidebar()">Dashboard</a>
      <a routerLink="/reports" (click)="closeSidebar()">Reports</a>
      <a routerLink="/system" (click)="closeSidebar()">System Health</a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
